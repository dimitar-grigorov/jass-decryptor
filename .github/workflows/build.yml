name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      # Version from the tag, even if not bumped in the code
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $f = 'csharp/JassDecryptor.cs'
          (Get-Content $f -Raw) -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$($env:GITHUB_REF_NAME.TrimStart('v')).0`")" | Set-Content $f -NoNewline

      - name: Build
        shell: cmd
        run: csharp\build.cmd

      - name: Round-trip test (C# and Python)
        shell: pwsh
        run: |
          python python/selftest.py make t
          $p = Start-Process csharp/JassDecryptor.exe -ArgumentList '/cli', "`"$PWD\t\jass`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "JassDecryptor.exe exit code $($p.ExitCode)" }
          python python/selftest.py check t t/jass
          if ($LASTEXITCODE) { throw 'C# output differs' }
          python python/jass_decryptor.py t/jass t/py
          python python/selftest.py check t t/py
          if ($LASTEXITCODE) { throw 'Python output differs' }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash csharp/JassDecryptor.exe -Algorithm SHA256).Hash.ToLower()
          "$h  JassDecryptor.exe" | Out-File -Encoding ascii csharp/JassDecryptor.exe.sha256
          Get-Content csharp/JassDecryptor.exe.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: JassDecryptor
          path: |
            csharp/JassDecryptor.exe
            csharp/JassDecryptor.exe.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: JassDecryptor
          path: dist

      # Lets anyone check that the exe was built here from this tag: gh attestation verify
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/JassDecryptor.exe

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($v)) [^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no entry for $v" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 notes.md

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/JassDecryptor.exe dist/JassDecryptor.exe.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
