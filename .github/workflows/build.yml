name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: csharp\build.cmd

      - name: Round-trip test (C# and Python)
        shell: pwsh
        run: |
          python python/selftest.py make t
          $p = Start-Process csharp/JassDecryptor.exe -ArgumentList '/cli', "`"$PWD\t\jass`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "JassDecryptor.exe exit code $($p.ExitCode)" }
          python python/selftest.py check t t/jass
          if ($LASTEXITCODE) { throw 'C# output differs' }
          python python/jass_decryptor.py t/jass t/py
          python python/selftest.py check t t/py
          if ($LASTEXITCODE) { throw 'Python output differs' }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash csharp/JassDecryptor.exe -Algorithm SHA256).Hash.ToLower()
          "$h  JassDecryptor.exe" | Out-File -Encoding ascii csharp/JassDecryptor.exe.sha256
          Get-Content csharp/JassDecryptor.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: JassDecryptor
          path: |
            csharp/JassDecryptor.exe
            csharp/JassDecryptor.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $m = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?ms)^## $([regex]::Escape($v)) [^\n]*\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "CHANGELOG.md has no entry for $v" }
          $m.Groups[1].Value.Trim() | Out-File -Encoding utf8 notes.md
          gh release create $env:GITHUB_REF_NAME csharp/JassDecryptor.exe csharp/JassDecryptor.exe.sha256 --title $env:GITHUB_REF_NAME --notes-file notes.md
